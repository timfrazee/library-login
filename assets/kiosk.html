<!doctype html>
<html lang="en"{{if .ThemeMode}} data-theme="{{.ThemeMode}}"{{end}} data-accent="{{.ThemeColor}}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Heading}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body class="kiosk">
  <main>
    {{if .HasLogo}}<img class="logo" src="/logo" alt="">{{end}}
    <h1>{{.Heading}}</h1>
    {{if .Instructions}}<p class="instructions">{{.Instructions}}</p>{{end}}
    <form method="post" action="/submit" autocomplete="off">
      <label for="id">{{.InputLabel}}</label>
      <div class="input-wrap">
        <input id="id" name="id" type="text" autofocus required>
        {{if .Message}}<div class="input-msg" data-status="{{.Status}}"><span>{{.Message}}</span></div>{{end}}
      </div>
      <button type="submit">{{.ButtonLabel}}</button>
    </form>
  </main>
  <script>
    const input = document.getElementById('id');
    const overlay = document.querySelector('.input-msg');

    if (overlay) {
      history.replaceState(null, '', '/'); // drop the query so a refresh doesn't replay it
      const timer = setTimeout(() => overlay.remove(), 4000);
      input.addEventListener('keydown', () => {
        clearTimeout(timer);
        overlay.remove();
      }, { once: true });
    }
    input.focus();
  </script>
</body>

</html>
